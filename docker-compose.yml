services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-school_fee}
    # Bound to localhost only — the api service reaches this over the
    # internal Docker network (host "db"), so Postgres should never be
    # reachable from outside the VPS itself. Use an SSH tunnel to inspect
    # it remotely instead of opening this port publicly.
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3010
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-school_fee}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      PARENT_JWT_SECRET: ${PARENT_JWT_SECRET:-change-me-parent}
      PARENT_JWT_EXPIRES_IN: ${PARENT_JWT_EXPIRES_IN:-30d}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-VIETQR}
      BANK_CODE: ${BANK_CODE:-}
      BANK_ACCOUNT_NUMBER: ${BANK_ACCOUNT_NUMBER:-}
      BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME:-}
      PAYMENT_ORDER_EXPIRES_MINUTES: ${PAYMENT_ORDER_EXPIRES_MINUTES:-60}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ZALO_OA_ID: ${ZALO_OA_ID:-}
      ZALO_APP_ID: ${ZALO_APP_ID:-}
      ZALO_APP_SECRET: ${ZALO_APP_SECRET:-}
      ZALO_ZNS_TEMPLATE_ID: ${ZALO_ZNS_TEMPLATE_ID:-}
      ZALO_INITIAL_REFRESH_TOKEN: ${ZALO_INITIAL_REFRESH_TOKEN:-}
      VIETINBANK_BASE_URL: ${VIETINBANK_BASE_URL:-}
      VIETINBANK_CLIENT_ID: ${VIETINBANK_CLIENT_ID:-}
      VIETINBANK_CLIENT_SECRET: ${VIETINBANK_CLIENT_SECRET:-}
      VIETINBANK_PROVIDER_ID: ${VIETINBANK_PROVIDER_ID:-9752}
      VIETINBANK_MERCHANT_ID: ${VIETINBANK_MERCHANT_ID:-9752}
      VIETINBANK_ACCOUNT: ${VIETINBANK_ACCOUNT:-}
      # Left empty until VietinBank returns their signed cert — see
      # CryptoKeyService.onModuleInit(): a non-empty PRIVATE_KEY_PATH makes
      # the app load/verify all three key files at boot and crash if any is
      # missing, which would take down the whole API (VietQR included), not
      # just VietinBank. Only set these three in .env once
      # certs/viettinbank/{private,public,notify-cert}.pem are all in place.
      VIETINBANK_PRIVATE_KEY_PATH: ${VIETINBANK_PRIVATE_KEY_PATH:-}
      VIETINBANK_PUBLIC_KEY_PATH: ${VIETINBANK_PUBLIC_KEY_PATH:-}
      VIETINBANK_NOTIFY_CERT_PATH: ${VIETINBANK_NOTIFY_CERT_PATH:-}
    # Bound to localhost only — a reverse proxy (nginx/Caddy) on the VPS
    # terminates TLS and forwards to this port. Do not expose 3010
    # publicly; the public-facing port must be 443 on the proxy.
    ports:
      - '127.0.0.1:3010:3010'
    # VietinBank RSA keys/cert are secrets — never baked into the image.
    # Mounted read-only from the deploy host's ./certs/viettinbank/.
    volumes:
      - ./certs:/app/certs:ro

volumes:
  db_data:
